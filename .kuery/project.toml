# Kuery project.
# Connection passwords are kept in the system keychain, not in this file.
# These point at the dev Postgres and Redis in dev/compose.yaml, which need
# no password; local-dev-ssh reaches the same Postgres through the compose
# file's SSH bastion.

[project]
name = "Checkout v2"
workspace = "Online Store"

[[connections]]
id = "local-dev"
name = "local-dev"
host = "localhost"
port = 54329
database = "kuery"
user = "kuery"
environment = "development"

[[connections]]
id = "local-dev-ssh"
name = "local-dev-ssh"
host = "postgres"
port = 5432
database = "kuery"
user = "kuery"
environment = "development"

[connections.ssh]
host = "localhost"
port = 22229
user = "kuery"

[[connections]]
id = "local-analytics"
name = "local-analytics"
host = "localhost"
port = 54329
database = "analytics"
user = "kuery"
environment = "staging"

[[connections]]
id = "prod-replica"
name = "prod-replica"
host = "localhost"
port = 54329
database = "kuery"
user = "kuery"
environment = "production"

[[connections]]
id = "local-cache"
name = "local-cache"
driver = "redis"
host = "localhost"
port = 63799
database = "0"
environment = "development"

[[connections]]
id = "prod-cache"
name = "prod-cache"
driver = "redis"
host = "localhost"
port = 63799
database = "0"
environment = "production"
