name: Pages

# Publishes site/ to GitHub Pages with the latest release's download links.
# The release workflow starts this one after it publishes a release, because
# a release created with the workflow token triggers no `release` event.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - crates/app/assets/branding/kuery.png
      - .github/scripts/build-site.sh
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/build-site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
