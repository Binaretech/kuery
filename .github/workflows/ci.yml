name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes cold builds and caches much bigger, and CI only needs
  # it for backtraces.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  build:
    name: Tests and clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # NTFS and Defender scanning make Windows builds slow; a trusted ReFS
      # Dev Drive avoids both. The build runs in its copy of the checkout.
      - name: Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 30GB
          workspace-copy: true
          trusted-dev-drive: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      # What gpui needs to link on Linux (X11, Wayland and fonts).
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev

      # The version comes from rust-toolchain.toml.
      - name: Toolchain
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEV_DRIVE_WORKSPACE || '.' }}
          # PRs reuse main's cache; saving one per PR costs minutes.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # Lints barely differ between platforms; Linux is the fastest to check.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # MongoDB's driver speaks TLS through rustls with ring alone; nothing
      # in the workspace may bring in OpenSSL.
      - name: Only ring for TLS
        if: runner.os == 'Linux'
        run: |
          tree=$(cargo tree --locked -p kuery-mongo -e normal --prefix none)
          grep -q '^ring ' <<< "$tree"
          if grep -q '^aws-lc-rs ' <<< "$tree"; then
            echo "kuery-mongo brings in aws-lc-rs"
            exit 1
          fi
          if cargo tree --locked -i openssl-sys > /dev/null 2>&1; then
            echo "something brings in OpenSSL"
            exit 1
          fi

      # In the Dev Drive copy on Windows, the checkout elsewhere.
      - name: Tests
        working-directory: ${{ env.DEV_DRIVE_WORKSPACE || github.workspace }}
        run: cargo test --workspace --locked

  postgres:
    name: kuery-pg tests against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kuery
          POSTGRES_PASSWORD: kuery
          POSTGRES_DB: kuery
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U kuery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGPASSWORD: kuery
      KUERY_DATABASE_URL: postgres://kuery:kuery@localhost:54329/kuery
      KUERY_TLS_DATABASE_URL: postgres://kuery:kuery@localhost:54330/kuery
    steps:
      - uses: actions/checkout@v5

      - name: Sample data
        run: |
          psql -h localhost -p 54329 -U kuery -d kuery -v ON_ERROR_STOP=1 -q -f dev/seed.sql
          psql -h localhost -p 54329 -U kuery -d kuery -v ON_ERROR_STOP=1 -q -f dev/seed-analytics.sql

      # A second Postgres with TLS (the image's self-signed certificate) for
      # the sslmode tests. Services do not accept server arguments, so it is
      # started by hand.
      - name: Postgres with TLS
        run: |
          docker run -d --name postgres-tls -p 54330:5432 \
            -e POSTGRES_USER=kuery -e POSTGRES_PASSWORD=kuery -e POSTGRES_DB=kuery \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
          for _ in $(seq 60); do
            if psql "$KUERY_TLS_DATABASE_URL?sslmode=require" -tAc "show ssl" 2>/dev/null | grep -q on; then
              exit 0
            fi
            sleep 1
          done
          docker logs postgres-tls
          exit 1

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One at a time: several tests change the shared seeded `orders`
      # table inside transactions and deadlock when they overlap.
      - name: Ignored kuery-pg tests
        run: cargo test -p kuery-pg --locked -- --ignored --test-threads=1

  redis:
    name: kuery-redis tests against Redis
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5

      - name: Sample data
        run: |
          docker run --rm --network host -e REDIS_PORT=63799 \
            -v "$PWD/dev:/seed:ro" redis:7-alpine sh /seed/seed-redis.sh

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ignored kuery-redis tests
        run: cargo test -p kuery-redis --locked -- --ignored

  mssql:
    name: kuery-mssql tests against SQL Server
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kuery_dev_2026!
        ports:
          - 14339:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kuery_dev_2026!' -Q 'select 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v5

      - name: Sample data
        run: |
          docker run --rm --network host -v "$PWD/dev:/seed:ro" \
            mcr.microsoft.com/mssql/server:2022-latest \
            /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost,14339 -U sa -P 'Kuery_dev_2026!' \
            -i /seed/seed-mssql.sql

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Ignored kuery-mssql tests
        run: cargo test -p kuery-mssql --locked -- --ignored

  mongo:
    name: kuery-mongo tests against a MongoDB replica set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The dev services: a seeded single-node replica set with
      # authentication, and a standalone server without it for what a
      # standalone lacks. Services cannot take their commands, so compose
      # starts them. The job waits for the replica set's healthcheck, then
      # for the seed's last collection on both, which is still filling when
      # the healthcheck first passes.
      - name: MongoDB
        run: |
          docker compose -f dev/compose.yaml --profile standalone up -d mongo mongo-standalone
          for _ in $(seq 90); do
            health=$(docker compose -f dev/compose.yaml ps --format json mongo | jq -r '.Health')
            if [ "$health" = healthy ]; then
              seeded=$(docker compose -f dev/compose.yaml exec -T mongo \
                mongosh --port 27019 -u kuery -p kuery --authenticationDatabase admin --quiet \
                --eval 'db.getSiblingDB("shop").big.countDocuments()' 2> /dev/null || true)
              standalone=$(docker compose -f dev/compose.yaml exec -T mongo-standalone \
                mongosh --quiet \
                --eval 'db.getSiblingDB("shop").big.countDocuments()' 2> /dev/null || true)
              if [ "$seeded" = 20000 ] && [ "$standalone" = 20000 ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          docker compose -f dev/compose.yaml logs mongo mongo-standalone
          exit 1

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One at a time: the capped count runs JavaScript over the big
      # collection against a 5-second limit, which other tests can push past.
      # The standalone checks fail rather than skip when it is missing.
      - name: Ignored kuery-mongo tests
        env:
          KUERY_MONGO_STANDALONE: required
        run: cargo test -p kuery-mongo --locked -- --ignored --test-threads=1
