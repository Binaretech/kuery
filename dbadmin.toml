# Development project: connections to the Postgres in dev/compose.yaml.
# Credentials here are for that local, throwaway database only.

[project]
name = "Checkout v2"
workspace = "Online Store"

[[connections]]
name = "local-dev"
url = "postgres://dbadmin:dbadmin@localhost:54329/dbadmin"
environment = "development"

[[connections]]
name = "local-analytics"
url = "postgres://dbadmin:dbadmin@localhost:54329/analytics"
environment = "staging"

# Same database labelled as production, to try the read-only behaviour.
[[connections]]
name = "prod-replica"
url = "postgres://dbadmin:dbadmin@localhost:54329/dbadmin"
environment = "production"
