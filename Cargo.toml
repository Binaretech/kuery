[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
kuery-core = { path = "crates/core" }
kuery-pg = { path = "crates/pg" }
kuery-redis = { path = "crates/redis" }
kuery-sqlite = { path = "crates/sqlite" }
kuery-mysql = { path = "crates/mysql" }

anyhow = "1"
arrow-array = "60"
async-channel = "2"
futures = "0.3"
keyring = "4"
serde = { version = "1", features = ["derive"] }
# Pretty-printing JSON values in Redis keys, keeping their key order.
serde_json = { version = "1", features = ["preserve_order"] }
sqlformat = "0.5"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-postgres = "0.7"
# SQLite compiled in, so no system library is needed anywhere.
# MySQL and MariaDB over rustls with `ring`, like the rest.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks", "column_decltype"] }
# TLS with rustls and the `ring` provider (no aws-lc, which needs cmake and NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.14"
# Async, reconnecting connections; TLS through the same rustls (and `ring`) as Postgres.
redis = { version = "1.7", default-features = false, features = ["acl", "streams", "tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# gpui-kit pins its own gpui version; upgrade it on purpose, never by accident.
# SQL for query tabs; Bash for the Redis console, whose lines are shell-like
# (words, quoted strings, `#` comments).
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql", "tree-sitter-bash"] }
# The editor's completion types; must be the version gpui-kit uses.
lsp-types = "0.97"

[profile.dev.package."*"]
opt-level = 2
