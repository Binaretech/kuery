[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
kuery-core = { path = "crates/core" }
kuery-pg = { path = "crates/pg" }
kuery-redis = { path = "crates/redis" }
kuery-sqlite = { path = "crates/sqlite" }
kuery-mysql = { path = "crates/mysql" }
kuery-mssql = { path = "crates/mssql" }
kuery-files = { path = "crates/files" }
kuery-update = { path = "crates/update" }

# Local file analytics; keep Polars behind kuery-files, separate from core's Arrow.
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "csv", "json", "parquet", "temporal", "timezones", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time", "dtype-decimal", "dtype-struct", "dtype-array", "dtype-i8", "dtype-i16", "dtype-u8", "dtype-u16"] }

anyhow = "1"
arrow-array = "60"
async-channel = "2"
futures = "0.3"
keyring = "4"
# SQL Server's showplan XML, read into plans.
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
# Pretty-printing JSON values in Redis keys, keeping their key order.
serde_json = { version = "1", features = ["preserve_order"] }
sqlformat = "0.5"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-postgres = "0.7"
# SQLite compiled in, so no system library is needed anywhere.
# MySQL and MariaDB over rustls with `ring`, like the rest.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks", "column_decltype"] }
# SQL Server over rustls. Its tokio-rustls adds aws-lc-rs as a second provider, so the app installs ring at startup.
# native-tls hangs in the handshake on macOS.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "sql-browser-tokio"] }
tokio-util = { version = "0.7", features = ["compat"] }
# TLS with rustls and the `ring` provider, the one every connection uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = "0.14"
# Async, reconnecting connections; TLS through the same rustls (and `ring`) as Postgres.
redis = { version = "1.7", default-features = false, features = ["acl", "streams", "tokio-comp", "tokio-rustls-comp", "connection-manager"] }

# The updater: the manifest and archives over HTTPS (blocking, run off the UI
# thread), with rustls and `ring` like the database connections.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# Update archives are signed with minisign; the app only verifies.
minisign-verify = "0.2"
semver = "1"
sha2 = "0.10"

# gpui-kit pins its own gpui version; upgrade it on purpose, never by accident.
# SQL for query tabs; Bash for the Redis console, whose lines are shell-like
# (words, quoted strings, `#` comments).
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql", "tree-sitter-bash"] }
# The editor's completion types; must be the version gpui-kit uses.
lsp-types = "0.97"

[profile.dev.package."*"]
opt-level = 2
