[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dbadmin-core = { path = "crates/core" }
dbadmin-pg = { path = "crates/pg" }

anyhow = "1"
arrow-array = "60"
async-channel = "2"
futures = "0.3"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-postgres = "0.7"

# gpui-kit fija su propia versión de gpui; se actualiza a propósito, nunca por accidente.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-sql"] }

[profile.dev.package."*"]
opt-level = 2
