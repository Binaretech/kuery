# Local Postgres for development and for the technical test.
# Development-only credentials; see .env.example at the repo root.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: dbadmin
      POSTGRES_DB: dbadmin
    ports:
      - "54329:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./seed-analytics.sql:/docker-entrypoint-initdb.d/20-analytics.sql:ro
