# Local Postgres and Redis for development and for the technical test.
# Development-only credentials; see .env.example at the repo root.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuery
      POSTGRES_PASSWORD: kuery
      POSTGRES_DB: kuery
      # Local throwaway database: trust connections so the repo's own
      # .kuery project works without keychain passwords.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54329:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
      - ./seed-analytics.sql:/docker-entrypoint-initdb.d/20-analytics.sql:ro

  redis:
    image: redis:7-alpine
    # No persistence: the example data is loaded again on every start.
    command:
      - sh
      - -c
      - >-
        redis-server --save '' --appendonly no &
        until redis-cli ping > /dev/null 2>&1; do sleep 0.2; done;
        sh /seed/seed-redis.sh;
        wait
    ports:
      - "63799:6379"
    volumes:
      - ./seed-redis.sh:/seed/seed-redis.sh:ro

  # MySQL with the sample shop in the `shop` database; user kuery, no
  # password (development only).
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: shop
    ports:
      - "33069:3306"
    volumes:
      - ./seed-mysql.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro

  # An SSH host to try SSH tunnels with: from it, Postgres is postgres:5432
  # and Redis redis:6379. Development only: user kuery, no password.
  bastion:
    image: alpine:3.20
    command:
      - sh
      - -c
      - >-
        apk add --no-cache openssh > /dev/null &&
        ssh-keygen -A > /dev/null &&
        (id kuery > /dev/null 2>&1 || adduser -D kuery) &&
        passwd -d kuery > /dev/null &&
        exec /usr/sbin/sshd -D -e
        -o PasswordAuthentication=yes
        -o PermitEmptyPasswords=yes
        -o AllowTcpForwarding=yes
    ports:
      - "22229:22"

  # SQL Server 2022 (amd64 only: emulated on Apple silicon, so the first start
  # takes a minute or two). User sa, development-only password.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Kuery_dev_2026!"
    ports:
      - "14339:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Kuery_dev_2026!' -Q "select 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Loads the sample shop into SQL Server once the server is up (it starts
  # the `shop` database over each time): docker compose up -d mssql mssql-seed.
  mssql-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -C
      - -b
      - -S
      - mssql
      - -U
      - sa
      - -P
      - Kuery_dev_2026!
      - -i
      - /seed/seed-mssql.sql
    restart: "no"
    volumes:
      - ./seed-mssql.sql:/seed/seed-mssql.sql:ro
