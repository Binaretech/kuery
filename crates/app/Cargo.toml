[package]
name = "kuery"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kuery-core.workspace = true
kuery-pg.workspace = true
kuery-redis.workspace = true
kuery-sqlite.workspace = true
kuery-mysql.workspace = true
kuery-mssql.workspace = true
kuery-files.workspace = true
kuery-update.workspace = true
anyhow.workspace = true
async-channel.workspace = true
futures.workspace = true
gpui-kit.workspace = true
keyring.workspace = true
lsp-types.workspace = true
reqwest.workspace = true
rustls.workspace = true
sentry.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
# Headless windows for the sidebar bench; gpui-kit's own test-support clashes with the lock.
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
embed-resource = "3"
